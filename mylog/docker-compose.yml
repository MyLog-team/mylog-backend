services:
  postgres:
    image: "postgres:latest"
    container_name: mylog-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    container_name: mylog-rabbitmq
    image: "rabbitmq:latest"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
  redis:
    container_name: mylog-redis
    image: "redis:latest"
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ] # Redis 서버가 응답하는지 확인
      interval: 1s # 1초마다 체크
      timeout: 3s # 3초 내에 응답 없으면 실패
      retries: 30 # 최대 30번 (30초) 재시도
      start_period: 5s # 컨테이너 시작 후 5초 동안은 헬스 체크 실패해도 무시
      # --- 여기까지 추가/수정 ---

  application:
    build: .
    container_name: mylog-springboot
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started # postgres는 기본적으로 시작만 되면 됨
      rabbitmq:
        condition: service_started # rabbitmq도 시작만 되면 됨
      redis:
        condition: service_healthy # ★ Redis가 'healthy' 상태가 될 때까지 기다림
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}

volumes:
  postgres_data:
