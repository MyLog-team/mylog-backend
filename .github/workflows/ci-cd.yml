name: MyLog CI/CD

on:
  push:
    branches:
    - main # main 브랜치에 push 될 때 실행
  pull_request:
    branches:
      - main
      - dev


jobs:
  build-and-deploy: # 빌드와 배포 작업
    runs-on: ubuntu-latest # 실행 환경 -> CI/CD 모두 같은 실행환경에서 작동해야한다.


#    services:
#      redis: # 테스트용 Redis 컨테이너 추가
#        image: redis
#        ports:
#          - 6379:6379
#        options: >-
#          --health-cmd "redis-cli ping"
#          --health-interval 10s
#          --health-timeout 5s
#          --health-retries 5


    # 1~5 : CI 작업
    # 6 : CD 작업
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout project source code # 내 프로젝트 코드를 불러옴
        uses: actions/checkout@v4 # 라이브러리를 깃허브 마켓플레이스에서 가져옴
        

      # 2. JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: # 액션에 필요한 설정
          java-version: "21"
          distribution: "temurin"


      # 3. Gradle 빌드 (테스트 포함 -> 테스트가 동작하는지 확인하기 위함)
      - name: Build my project with Gradle
        working-directory: ./mylog
        env: # 환경 변수 설정
          JWT_SECRET: ${{ secrets.JWT_SECRET }} # JWT secret 키
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # youtube api 키
#          CHATGPT_API_KEY: 필요시 연결

        run: |
          chmod +x ./gradlew
          ./gradlew build

      # 4. Docker Hub 로그인 -> 프로젝트 이미지를 올리기 위함
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }} # ${{}}로 둘러쌓인 값은 Github Secrets에서 값을 저장후 할당함
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}



      - name: Get Merged PR Info
        id: get_pr_info
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |

          PR_INFO=$(gh pr list --repo ${{ github.repository }} --state closed --search "is:merged" --json number,title,headRefName,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\")")


          echo "PR_NUMBER=$(echo $PR_INFO | jq .number)" >> $GITHUB_OUTPUT
          echo "PR_TITLE=$(echo $PR_INFO | jq .title)" >> $GITHUB_OUTPUT
          echo "PR_BRANCH=$(echo $PR_INFO | jq .headRefName)" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 병합된 브랜치 정보를 로그에 출력 (새로 추가된 단계)
      - name: Show Merged Branch Info
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "=========================================================="
          echo "🚀 A new version is being built and deployed!"
          echo "----------------------------------------------------------"
          echo "  - Merged from: ${{ steps.get_pr_info.outputs.PR_BRANCH }}"
          echo "  - PR Number  : #${{ steps.get_pr_info.outputs.PR_NUMBER }}"
          echo "  - PR Title   : ${{ steps.get_pr_info.outputs.PR_TITLE }}"
          echo "=========================================================="


      # 5. Docker 이미지 빌드 및 푸시
      - name: Build and push mylog Docker image
        run: |
          IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
          
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mylog:$IMAGE_TAG -t ${{ secrets.DOCKER_HUB_USERNAME }}/mylog:latest ./mylog
          
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mylog:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mylog:latest
          

      # 모니터링 도구 관련 설정 필요



